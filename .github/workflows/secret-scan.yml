name: secret-scan

# PR の検査は pull_request_target で動かす。workflow の定義と .gitleaks.toml は常に
# base ブランチのものが使われるので、PR は検査の規則を緩めることも、このジョブを外すこともできない。
# PR の head は git のオブジェクトとして取得して検査するだけで、checkout も実行もしない。
# pull_request では動かさない（PR 側が書き換えた定義で同名のジョブが動くのを避ける）。
on:
  push:
    branches: [main]
  pull_request_target: # zizmor: ignore[dangerous-triggers] base の定義と設定で検査し、PR のコードは checkout も実行もしない
    branches: [main]
  # 手動で全履歴を検査する
  workflow_dispatch:

# concurrency は付けない。pull_request_target の github.ref は base のブランチなので、
# ref で group を作ると別の PR や main の検査を取り消し合う。
permissions: {}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target: イベントが固定した base のコミット
          # push / workflow_dispatch: イベントのコミット
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          # 検査範囲（merge-base..head、before..after、全履歴）を解決するため全履歴を取得する
          fetch-depth: 0
          persist-credentials: false

      # 開発環境の Dev Container と同じ版を、アーカイブの SHA-256 を照合して入れる。
      # $GITHUB_PATH には書かず、/usr/local/bin に置く
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          archive="$tmp/gitleaks.tar.gz"
          curl -fL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # イベントの値は run に直接埋め込まず、env で渡す。
      # tests/test_workflows.py がこの step の run を取り出して実行するので、id を変えない
      - name: Scan for secrets
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 環境変数から検査の規則を差し替えられないようにする。gitleaks は --config、
          # これらの環境変数、検査対象のツリーの .gitleaks.toml の順に設定を探す。
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          config="$GITHUB_WORKSPACE/.gitleaks.toml"
          if [[ ! -f "$config" ]]; then
            echo "error: base-owned .gitleaks.toml is missing" >&2
            exit 1
          fi
          # gitleaks は --gitleaks-ignore-path を渡しても、検査対象のディレクトリの
          # .gitleaksignore を読んで検出を除外する。規則は .gitleaks.toml だけにし、
          # 開発環境の push 前の検査（.gitleaksignore があれば止まる）とそろえる。
          if [[ -e "$GITHUB_WORKSPACE/.gitleaksignore" || -L "$GITHUB_WORKSPACE/.gitleaksignore" ]]; then
            echo "error: .gitleaksignore is not used; add exceptions to .gitleaks.toml instead" >&2
            exit 1
          fi

          log_opts=""
          case "$EVENT_NAME" in
            pull_request_target)
              if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] \
                || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
                || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "error: malformed pull_request_target event fields" >&2
                exit 1
              fi
              checked_out="$(git rev-parse HEAD)"
              if [[ "$checked_out" != "$BASE_SHA" ]]; then
                echo "error: checked-out base $checked_out != event base.sha $BASE_SHA" >&2
                exit 1
              fi
              # PR の head は git のオブジェクトとして取得するだけで、checkout しない。
              # 待ちの間に pull ref の先端が動くことがあるので、イベントが固定した
              # commit だけを検査する。取得できなければ git の失敗で止まる。
              git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
              fetched="$(git rev-parse FETCH_HEAD)"
              if [[ "$fetched" != "$HEAD_SHA" ]]; then
                echo "error: fetched pull/$PR_NUMBER/head $fetched != event head.sha $HEAD_SHA" >&2
                exit 1
              fi
              # 上の検査は base の作業ツリーを見るので、PR 側の変更はマージ後に初めて効く。
              # .gitleaksignore を足す・.gitleaks.toml を消す PR を通すと、マージ後は main と
              # 以降のすべての PR の検査が止まるので、PR の時点で失敗させる（オブジェクトを読むだけ）。
              if git cat-file -e "$HEAD_SHA:.gitleaksignore" 2>/dev/null; then
                echo "error: the pull request adds .gitleaksignore; add exceptions to .gitleaks.toml instead" >&2
                exit 1
              fi
              if ! git cat-file -e "$HEAD_SHA:.gitleaks.toml" 2>/dev/null; then
                echo "error: the pull request removes .gitleaks.toml" >&2
                exit 1
              fi
              merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
              log_opts="$merge_base..$HEAD_SHA"
              ;;
            push)
              checked_out="$(git rev-parse HEAD)"
              if [[ "$checked_out" != "$PUSH_AFTER" ]]; then
                echo "error: checked-out $checked_out != event sha $PUSH_AFTER" >&2
                exit 1
              fi
              if [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] \
                && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                log_opts="$PUSH_BEFORE..$PUSH_AFTER"
              else
                # 新しいブランチ（before がゼロの SHA）や履歴が欠けている場合は、省略せず全履歴を検査する
                log_opts=""
              fi
              ;;
            *)
              # workflow_dispatch: 全履歴を検査する
              log_opts=""
              ;;
          esac

          if [[ -n "$log_opts" ]]; then
            gitleaks git --redact --no-banner --config "$config" --ignore-gitleaks-allow --log-opts="$log_opts" .
          else
            gitleaks git --redact --no-banner --config "$config" --ignore-gitleaks-allow .
          fi
